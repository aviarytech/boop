name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so a package.json change that skips bun.lock fails here
      # rather than at deploy time (Railway installs the same way).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
